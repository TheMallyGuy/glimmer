name: Distribute OTA Update

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bunx @crabnebula/ota-updater upload
        env:
          PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.OTA_SIGNING_PRIVATE_KEY_PASSWORD }}
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
