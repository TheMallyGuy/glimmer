name: Release

on:
  push:
    branches: [release, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CN_APPLICATION: "glim/glimmer"
  CN_CHANNEL: ${{ github.ref_name == 'master' && '--channel nightly' || '--channel prod' }}

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Report failure to Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          nodetail: true
          title: "verify"
          description: "Bun check failed"
          content: "<@&1559571354825531492>"
          color: 0xff0000

      - run: bun test

  draft:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - if: github.ref_name == 'master'
        run: node .github/scripts/set-nightly.mjs ${{ github.run_number }}

      # makes the release for the version in tauri.conf.json; the build uploads into it
      - uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri ${{ env.CN_CHANNEL }}
          api-key: ${{ secrets.CN_API_KEY }}

  build:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.ref_name == 'master'
        run: node .github/scripts/set-nightly.mjs ${{ github.run_number }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # signs the update files with the key whose public half is `plugins.updater.pubkey` in tauri.conf.json
      - run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Report failure to Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          nodetail: true
          title: "build"
          description: |
            Tauri build failed
            [CI Build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          content: "<@&1559571354825531492>"
          color: 0xff0000

      - uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri ${{ env.CN_CHANNEL }}
          api-key: ${{ secrets.CN_API_KEY }}

  build-android:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - if: github.ref_name == 'master'
        run: node .github/scripts/set-nightly.mjs ${{ github.run_number }}

      - name: Read the release version
        run: echo "RELEASE_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Decode the release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" bun run tauri android build --apk --target aarch64
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Report failure to Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          nodetail: true
          title: "build-android"
          description: "Android build failed"
          content: "<@&1559571354825531492>"
          color: 0xff0000

      - uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} ${{ env.RELEASE_VERSION }} ${{ env.CN_CHANNEL }} --public-platform apk-aarch64 --file src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          api-key: ${{ secrets.CN_API_KEY }}

  publish:
    needs: [build, build-android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - if: github.ref_name == 'master'
        run: node .github/scripts/set-nightly.mjs ${{ github.run_number }}

      - uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri ${{ env.CN_CHANNEL }}
          api-key: ${{ secrets.CN_API_KEY }}

      - name: Report failure to Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          nodetail: true
          title: "publish"
          description: "Release publish failed"
          content: "<@&1559571354825531492>"
          color: 0xff0000