[package]
name = "glimmer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glimmer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-helper = "0.1.4"
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-result = "0.4.1"
winreg = "0.56.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
] }


[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-ota-updater = "2"
serde_json = "1"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-http = { version = "2.7.0", features = ["unsafe-headers"] }
tauri-helper = "0.2.1"
tauri-plugin-fs = "2.6.0"
specta = "2.0.0-rc.25"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
zip = "8.6.0"
tauri-plugin-log = "2.10.0"
md5 = "0.8.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
log = "0.4.34"
dirs = "7.0.0"
rayon = "1.12.0"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-shizuku = "0.1.1"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2.4.0"
sysinfo = "0.39.6"
runas = "1.2.0"
discord-rich-presence = "0.2.5"
app-finder = "0.1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
tauri-plugin-shizuku = "0.1.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace]
members = [
    ".",
]
