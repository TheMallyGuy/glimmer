<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glimmer blush</title>
    <!--
  A Glimmer launch screen. Glimmer fills in the elements with these ids:
  status, percent, progress-track, progress-bar, retry-btn, cancel-btn.
  Scripts don't run here; style it with CSS only.
-->
    <style>
      /* the fonts the built-in launch screen uses */
      @import url("https://fonts.googleapis.com/css2?family=Cal+Sans&family=Geist:wght@400;500&display=swap");
      :root {
        --bg: #fef1ee;
        --fg: #0d0d0d;
        --muted: #4a3b39;
        --accent: #e8417f;
        --danger: #b3261e;
        --track: rgba(13, 13, 13, 0.12);
        --tonal: rgba(13, 13, 13, 0.08);
        --tonal-hover: rgba(13, 13, 13, 0.14);
        --hover: rgba(13, 13, 13, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: "Geist", "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .art {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .splash {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .top {
        display: flex;
        justify-content: flex-end;
        gap: 4px;
        padding: 8px;
      }
      button {
        height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 2px;
        font: inherit;
        font-size: 14px;
        color: var(--fg);
        background: transparent;
        cursor: pointer;
      }
      button:hover {
        background: var(--hover);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #retry-btn {
        background: var(--tonal);
      }
      #retry-btn:hover {
        background: var(--tonal-hover);
      }
      [hidden] {
        display: none !important;
      }
      .grow {
        flex-grow: 1;
      }
      .status-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 0 28px 20px;
      }
      #status {
        margin: 0;
        max-width: 380px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 14px;
        color: var(--muted);
      }
      #status.error {
        color: var(--danger);
      }
      #percent {
        font-family: "Cal Sans", "Geist", system-ui, sans-serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
      }
      #progress-track {
        position: relative;
        height: 3px;
        overflow: hidden;
        background: var(--track);
      }
      #progress-bar {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.2s ease-out;
      }
      #progress-bar.error {
        background: var(--danger);
      }
      #progress-bar.indeterminate {
        position: absolute;
        inset: 0 auto 0 0;
        width: 25%;
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          left: -25%;
        }
        to {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #progress-bar {
          transition: none;
        }
        #progress-bar.indeterminate {
          animation: none;
          left: 0;
        }
      }
    </style>
  </head>
